@if (visible()) {

<!-- Botón flotante arrastrable -->
<div class="rag-fab"
     [style.left.px]="fabPos().x"
     [style.top.px]="fabPos().y"
     [class.rag-fab--active]="abierto()"
     [class.rag-fab--dragging]="isDragging()"
     (mousedown)="onFabDown($event)"
     (touchstart)="onFabDown($event)"
     title="Archi — Asistente MetroApp">

  <!-- Avatar de Archi (visible cuando está cerrado) -->
  <span class="rag-fab__worker" [class.rag-fab__worker--hidden]="abierto()">
    <img src="assets/chatbot-arquitecto.png" alt="Archi, asistente de materiales">
  </span>

  <!-- X para cerrar -->
  <span class="rag-fab__close" [class.rag-fab__close--visible]="abierto()">
    <i class="bi bi-x-lg"></i>
  </span>
  <span class="rag-fab__ring"></span>
</div>

<!-- Panel de chat -->
@if (abierto()) {
  <div class="rag-panel"
       [style.left]="panelStyle().left"
       [style.top]="panelStyle().top"
       [style.width]="panelStyle().width">

    <div class="rag-panel__header">
      <!-- Avatar de Archi en el header -->
      <div class="rag-panel__header-icon">
        <img src="assets/chatbot-arquitecto.png" alt="">
      </div>
      <div class="rag-panel__header-info">
        <span class="rag-panel__header-title">Archi</span>
        <span class="rag-panel__header-sub">Tu asistente de obra y de la app</span>
      </div>
      <button class="rag-panel__close" (click)="cerrar()" title="Cerrar">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="rag-panel__messages">
      @for (msg of mensajes(); track $index) {
        <div class="rag-bubble"
             [class.rag-bubble--user]="msg.rol === 'usuario'"
             [class.rag-bubble--bot]="msg.rol === 'asistente'">
          @if (msg.cargando) {
            <span class="rag-typing">
              <span></span><span></span><span></span>
            </span>
          } @else {
            <pre class="rag-bubble__text">{{ msg.texto }}</pre>
          }
        </div>
      }
    </div>

    <div class="rag-panel__input-row">
      <textarea
        class="rag-panel__input"
        rows="2"
        placeholder="Preguntá sobre materiales o sobre la app..."
        [ngModel]="preguntaActual()"
        (ngModelChange)="preguntaActual.set($event)"
        (keydown)="onKeydown($event)"
        [disabled]="cargando()"
      ></textarea>
      <button class="rag-panel__send" (click)="enviar()" [disabled]="cargando() || !preguntaActual().trim()">
        <i class="bi bi-send-fill"></i>
      </button>
    </div>

    <div class="rag-panel__footer">
      <button class="rag-panel__hide-btn" (click)="ocultar()" title="Ocultar Archi (presioná a·r·c·h·i para volver a verlo)">
        <i class="bi bi-eye-slash"></i> Ocultar Archi
      </button>
    </div>

  </div>
}

} <!-- fin @if (visible()) -->
